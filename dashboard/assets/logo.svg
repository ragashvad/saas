<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="#667eea" opacity="0.1"/>
  
  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="url(#gradient1)" stroke-width="3"/>
  
  <!-- Leaf Icon - Left -->
  <path d="M 35 60 Q 35 40, 50 35 Q 45 45, 45 60 Z" fill="#10b981" opacity="0.9"/>
  
  <!-- Leaf Icon - Right -->
  <path d="M 85 60 Q 85 40, 70 35 Q 75 45, 75 60 Z" fill="#10b981" opacity="0.9"/>
  
  <!-- Center Circle (Earth) -->
  <circle cx="60" cy="60" r="20" fill="url(#gradient2)"/>
  
  <!-- Carbon Molecule Structure -->
  <circle cx="60" cy="45" r="3" fill="#fff"/>
  <circle cx="70" cy="55" r="3" fill="#fff"/>
  <circle cx="70" cy="65" r="3" fill="#fff"/>
  <circle cx="60" cy="75" r="3" fill="#fff"/>
  <circle cx="50" cy="65" r="3" fill="#fff"/>
  <circle cx="50" cy="55" r="3" fill="#fff"/>
  
  <!-- Connecting Lines -->
  <line x1="60" y1="45" x2="70" y2="55" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="70" y1="55" x2="70" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="70" y1="65" x2="60" y2="75" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="60" y1="75" x2="50" y2="65" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="50" y1="65" x2="50" y2="55" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  <line x1="50" y1="55" x2="60" y2="45" stroke="#fff" stroke-width="1.5" opacity="0.8"/>
  
  <!-- Gradients -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
